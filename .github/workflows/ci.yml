name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ruff==0.15.17 jsonschema==4.26.0 build==1.4.4
      - run: ruff check src tests scripts bin
      - run: python -m compileall -q src tests scripts
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python scripts/smoke.py
      - run: python scripts/check_privacy.py --history
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python scripts/smoke.py --installed
  nix-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - run: nix flake check --print-build-logs
      - run: nix develop --command gitleaks dir --redact .
      - run: nix develop --command gitleaks git --redact --log-opts=--all .
